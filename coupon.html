<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>优惠券模板编辑器</title>
    <link rel="stylesheet" href="./coupon.css" />
  </head>
  <body>
    <main class="coupon-app">
      <aside class="coupon-sidebar">
        <div class="coupon-brand">
          <span class="coupon-mark">卡</span>
          <div>
            <h1>抽卡机工具</h1>
            <p>tools</p>
          </div>
        </div>

        <section class="coupon-panel">
          <h2>模板</h2>
          <div class="template-grid" role="radiogroup" aria-label="选择优惠券模板">
            <button class="template-card active" type="button" data-template="cash">
              <span>满减券</span>
            </button>
            <button class="template-card" type="button" data-template="discount">
              <span>折扣券</span>
            </button>
            <button class="template-card" type="button" data-template="ticket">
              <span>门票券</span>
            </button>
            <button class="template-card" type="button" data-template="box">
              <span>买赠券</span>
            </button>
            <button class="template-card" type="button" data-template="draw">
              <span>抽卡券</span>
            </button>
            <button class="template-card" type="button" data-template="newcomer">
              <span>新人半价</span>
            </button>
          </div>
        </section>

        <section id="couponDrawPanel" class="coupon-panel" hidden>
          <h2>面值</h2>
          <div class="draw-amount-picker" role="radiogroup" aria-label="选择抽卡券面值">
            <button class="tag-option active" type="button" data-draw-amount="none">无金额</button>
            <button class="tag-option" type="button" data-draw-amount="20">20</button>
            <button class="tag-option" type="button" data-draw-amount="10">10</button>
            <button class="tag-option" type="button" data-draw-amount="5">5</button>
            <button class="tag-option" type="button" data-draw-amount="2">2</button>
            <button class="tag-option" type="button" data-draw-amount="1">1</button>
            <button class="tag-option" type="button" data-draw-amount="custom">自定义</button>
          </div>
          <label id="drawCustomAmountField" class="field" hidden>
            <span>自定义金额</span>
            <input id="drawCustomAmount" type="text" value="30" inputmode="decimal" />
          </label>
          <label class="coupon-third-toggle">
            <input id="drawRestricted" type="checkbox" />
            <span>限非新品</span>
          </label>
        </section>

        <section class="coupon-panel">
          <h2>文字</h2>
          <label class="field">
            <span>第一行</span>
            <input id="line1" type="text" />
          </label>
          <label class="field">
            <span>第二行</span>
            <input id="line2" type="text" />
          </label>
          <label id="thirdLineToggleRow" class="coupon-third-toggle">
            <input id="showThirdLine" type="checkbox" checked />
            <span>显示第三行</span>
          </label>
          <label id="thirdLineField" class="field">
            <span>第三行</span>
            <textarea id="line3" rows="3"></textarea>
          </label>
        </section>

        <section class="coupon-panel">
          <h2>导出</h2>
          <div class="action-row">
            <button id="downloadPng" type="button">下载 PNG</button>
          </div>
        </section>
      </aside>

      <section class="coupon-workspace">
        <div class="coupon-toolbar">
          <strong id="templateTitle">满减券</strong>
          <span>实时预览</span>
        </div>
        <div class="coupon-stage">
          <div id="couponPreview" class="coupon-preview" aria-label="优惠券预览"></div>
        </div>
      </section>
    </main>

    <script src="./coupon-fonts.js"></script>
    <script src="./coupon-newcomer-data.js"></script>
    <script src="./coupon-frame-data.js"></script>
    <script src="./draw-coupon-data.js"></script>
    <script src="./coupon-product-tag-data.js"></script>
    <script src="./coupon.js"></script>
  </body>
</html>
